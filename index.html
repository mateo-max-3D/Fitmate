<!DOCTYPE html>
<html lang="es" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>GOT - Your Gym Buddy</title>
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#17251F" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Google Fonts: Plus Jakarta Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  </head>
  <body class="bg-carbon text-cream h-full flex flex-col items-center justify-start select-none overflow-x-hidden">
    <div id="root" class="w-full h-full flex justify-center"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register PWA Service Worker for Offline-First operation
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          const basePath = window.location.pathname.endsWith('/')
            ? window.location.pathname
            : window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);
          const swUrl = (basePath || '/') + 'sw.js';
          navigator.serviceWorker.register(swUrl).then(reg => {
            console.log('GOT Service Worker registered:', reg.scope);
          }).catch(err => {
            console.log('SW registration fallback:', err);
            navigator.serviceWorker.register('./sw.js').catch(() => {});
          });
        });
      }
    </script>
  </body>
</html>
